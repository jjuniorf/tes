<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CinePrime Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #000000;
            --bg-surface: #121212;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent: #ffffff;
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        /* --- NATIVE BOTTOM NAVIGATION --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(65px + var(--safe-area-bottom));
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 10px;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            text-decoration: none;
            width: 20%;
            transition: opacity 0.2s;
        }

        .nav-item:active {
            opacity: 0.5;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-icon {
            font-size: 1.5rem;
        }

        .nav-text {
            font-size: 0.65rem;
            font-weight: 500;
        }

        /* --- MAIN SCROLL AREA --- */
        .app-main {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: calc(85px + var(--safe-area-bottom));
        }

        .app-view {
            display: none;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }

        .app-view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- MOBILE HERO --- */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 65vh;
            background-size: cover;
            background-position: center top;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, #000000 0%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,0.1) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
            text-align: center;
            padding-bottom: 20px;
        }

        .hero-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .btn-primary {
            background: var(--accent);
            color: black;
            border: none;
            padding: 14px 0;
            width: 90%;
            max-width: 300px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 0 auto;
        }

        .btn-primary:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        /* --- HORIZONTAL SWIPE ROWS --- */
        .section-container {
            padding: 24px 0 10px 16px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .swipe-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-right: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .media-card {
            flex: 0 0 130px; 
            scroll-snap-align: start;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: var(--bg-surface);
        }

        .media-card:active {
            opacity: 0.7;
        }

        .media-card img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            display: block;
        }

        /* --- POSTER BADGES & INFO --- */
        .card-rating {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 3px;
            z-index: 2;
        }

        .card-rating span {
            color: #2ecc71;
        }

        .card-tag {
            position: absolute;
            bottom: 38px;
            left: 6px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #fff;
            z-index: 2;
        }

        .card-info {
            padding: 6px 8px;
            background: var(--bg-surface);
        }

        .card-title-text {
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- CATALOG GRID --- */
        #catalog-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px;
        }

        #catalog-grid .media-card {
            flex: 0 0 calc(33.333% - 8px);
            scroll-snap-align: none;
        }

        /* --- SEARCH UI --- */
        .search-container {
            padding: 20px 16px;
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .search-input {
            width: 100%;
            background: var(--bg-surface);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
        }

        /* --- SLIDE-UP DETAIL VIEW --- */
        #view-detail {
            position: fixed;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100vh;
            background: var(--bg-base);
            z-index: 2000;
            overflow-y: auto;
            transition: top 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: block;
        }

        #view-detail.active {
            top: 0;
        }

        .close-btn {
            position: absolute;
            top: env(safe-area-inset-top, 20px);
            right: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 10;
        }

        .detail-meta {
            padding: 20px 16px;
        }

        .detail-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .meta-tags {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .detail-overview {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #d1d1d6;
            margin-bottom: 24px;
        }

        .action-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-secondary {
            flex: 1;
            background: var(--bg-surface);
            color: white;
            border: none;
            padding: 14px 0;
            border-radius: 8px;
            font-weight: 600;
        }

        .video-player-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            border: none;
            margin-bottom: 20px;
        }

        /* --- SERVERS UI --- */
        .servers-section {
            margin-bottom: 24px;
        }
        
        .servers-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .server-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        
        .server-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 4px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .server-btn.active-server {
            background: rgba(46, 204, 113, 0.15);
            border-color: #2ecc71;
            color: #2ecc71;
        }

        /* --- TV EPISODES --- */
        .season-selector {
            width: 100%;
            background: var(--bg-surface);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 16px;
            outline: none;
        }

        .episode-card {
            display: flex;
            gap: 12px;
            padding: 10px 8px;
            border-bottom: 0.5px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            transition: background 0.2s;
        }

        .episode-card.active-episode {
            background: rgba(46, 204, 113, 0.15);
            border-left: 3px solid #2ecc71;
        }

        .episode-thumb {
            width: 120px;
            aspect-ratio: 16/9;
            border-radius: 6px;
            object-fit: cover;
        }

        .episode-info h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .episode-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style></head><body>

    <!-- MAIN SCROLL AREA -->
    <main class="app-main" id="main-scroll">
        
        <!-- DISCOVER VIEW -->
        <div id="view-discover" class="app-view active">
            <div id="hero-container"></div>
            <div class="section-container">
                <h2 class="section-title">Trending Today</h2>
                <div id="trending-row" class="swipe-row"></div>
            </div>
            <div class="section-container">
                <h2 class="section-title">Popular TV</h2>
                <div id="trending-tv-row" class="swipe-row"></div>
            </div>
        </div>

        <!-- CATALOG (Movies/Series/Watchlist) -->
        <div id="view-catalog" class="app-view">
            <div class="search-container" style="background: var(--bg-base); padding-bottom: 0;">
                <h2 class="section-title" id="catalog-title" style="margin-bottom: 0;">Catalog</h2>
            </div>
            <div id="catalog-grid"></div>
            
            <!-- INFINITE SCROLL ASSETS -->
            <div id="catalog-loader" style="display: none; padding: 20px; text-align: center; width: 100%; color: var(--text-muted); font-size: 0.9rem;">Loading more...</div>
            <div id="catalog-sentinel" style="height: 20px; width: 100%;"></div>
        </div>

        <!-- SEARCH VIEW -->
        <div id="view-search" class="app-view">
            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="Search movies & shows..." autocomplete="off">
            </div>
            <div id="search-results-grid" style="display: flex; flex-wrap: wrap; gap: 12px; padding: 16px;"></div>
        </div>

    </main>

    <!-- NATIVE-STYLE BOTTOM NAV -->
    <nav class="bottom-nav">
        <div class="nav-item active" data-tab="discover" id="nav-discover">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">Home</span>
        </div>
        <div class="nav-item" data-tab="search" id="nav-search">
            <span class="nav-icon">🔍</span>
            <span class="nav-text">Search</span>
        </div>
        <div class="nav-item" data-tab="movies" id="nav-movies">
            <span class="nav-icon">🎬</span>
            <span class="nav-text">Movies</span>
        </div>
        <div class="nav-item" data-tab="tv" id="nav-tv">
            <span class="nav-icon">📺</span>
            <span class="nav-text">Series</span>
        </div>
        <div class="nav-item" data-tab="watchlist" id="nav-watchlist">
            <span class="nav-icon">➕</span>
            <span class="nav-text">List</span>
        </div>
    </nav>

    <!-- SLIDE-UP DETAIL VIEW -->
    <div id="view-detail">
        <div class="close-btn" onclick="closeDetail()">✕</div>
        <div id="player-container"></div>
        <div id="detail-backdrop" class="hero-banner" style="height: 40vh; padding:0;"></div>
        
        <div class="detail-meta">
            <h1 class="detail-title" id="detail-title">Loading...</h1>
            <div class="meta-tags" id="detail-tags"></div>
            
            <!-- BUTTONS (Play / Add to List) -->
            <div class="action-row" id="detail-actions"></div>
            
            <!-- SERVER BUTTONS CONTAINER -->
            <div id="movie-servers-container" style="display: none;"></div>

            <p class="detail-overview" id="detail-overview"></p>

            <div id="tv-episodes-section" style="display: none;">
                <select class="season-selector" id="season-selector" onchange="handleSeasonChange(this.value)"></select>
                
                <!-- NEW TV SERVERS CONTAINER -->
                <div id="tv-servers-container" style="display: none; margin-bottom: 16px;"></div>
                
                <div id="episodes-list"></div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'bcfd34b4689d58e049818b82653aa440'; // <--- PASTE API KEY HERE
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_500 = 'https://image.tmdb.org/t/p/w500';
        const IMG_ORIG = 'https://image.tmdb.org/t/p/original';

        // =================================================================
        // ⚙️ CONFIGURE YOUR MOVIE SERVERS HERE
        // =================================================================
        const MOVIE_SERVERS = [
            { name: 'Server 1', url: 'https://vidfast.vc/movie/{id}?autoPlay=true' },
            { name: 'Server 2', url: 'https://vidsrc.wiki/embed/movie/{id}' },
            { name: 'Server 3', url: 'https://vidsrc.sbs/embed/movie/{id}' },
            { name: 'Server 4', url: 'https://vaplayer.ru/embed/movie/{id}' }
        ];

        // =================================================================
        // ⚙️ CONFIGURE YOUR TV SERVERS HERE
        // =================================================================
        const TV_SERVERS = [
            { name: 'Server 1', url: 'https://vidfast.vc/tv/{id}/{season}/{episode}?autoPlay=true' },
            { name: 'Server 2', url: 'https://vidsrc.wiki/embed/tv/{id}/{season}/{episode}' },
            { name: 'Server 3', url: 'https://vidsrc.sbs/embed/tv/{id}/{season}/{episode}' },
            { name: 'Server 4', url: 'https://vaplayer.ru/embed/tv/{id}/{season}/{episode}' }
        ];

        let currentActiveTab = 'discover';
        let activeTvId = null;
        
        // Added TV State Tracking
        let currentTvServerIndex = 0;
        let currentPlayingEpisode = null;

        // Infinite Scroll State
        let catalogPage = 1;
        let totalPages = 1;
        let isFetching = false;
        let currentCatalogType = 'movie';

        // --- INTERSECTION OBSERVER FOR INFINITE SCROLL ---
        const catalogObserver = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                if ((currentActiveTab === 'movies' || currentActiveTab === 'tv') && !isFetching && catalogPage < totalPages) {
                    catalogPage++;
                    loadCatalog(currentCatalogType, 'popular', true);
                }
            }
        }, {
            root: document.getElementById('main-scroll'),
            rootMargin: '300px'
        });

        document.addEventListener('DOMContentLoaded', () => {
            catalogObserver.observe(document.getElementById('catalog-sentinel'));
        });

        // --- NAVIGATION ---
        document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const tab = item.getAttribute('data-tab');
                switchTab(tab);
            });
        });

        function switchTab(tab) {
            currentActiveTab = tab;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${tab}`).classList.add('active');
            
            document.querySelectorAll('.app-main .app-view').forEach(v => v.classList.remove('active'));
            document.getElementById('main-scroll').scrollTo(0,0);
            
            closeDetail();

            if (tab === 'discover') {
                document.getElementById('view-discover').classList.add('active');
                if(!document.getElementById('trending-row').innerHTML) loadDiscover();
            } else if (tab === 'search') {
                document.getElementById('view-search').classList.add('active');
                document.getElementById('search-input').focus();
            } else if (tab === 'movies') {
                document.getElementById('view-catalog').classList.add('active');
                document.getElementById('catalog-title').innerText = 'Popular Movies';
                loadCatalog('movie', 'popular', false);
            } else if (tab === 'tv') {
                document.getElementById('view-catalog').classList.add('active');
                document.getElementById('catalog-title').innerText = 'Popular Series';
                loadCatalog('tv', 'popular', false);
            } else if (tab === 'watchlist') {
                document.getElementById('view-catalog').classList.add('active');
                document.getElementById('catalog-title').innerText = 'My List';
                loadWatchlist();
            }
        }

        // --- DATA FETCHING ---
        async function loadDiscover() {
            try {
                let res = await fetch(`${BASE_URL}/trending/all/day?api_key=${API_KEY}`);
                let data = await res.json();
                let items = data.results.filter(i => i.backdrop_path);
                
                const hero = items[0];
                const type = hero.media_type || 'movie';
                document.getElementById('hero-container').innerHTML = `
                    <div class="hero-banner" style="background-image: url('${IMG_ORIG}${hero.backdrop_path}')">
                        <div class="hero-content">
                            <h1 class="hero-title">${hero.title || hero.name}</h1>
                            <button class="btn-primary" onclick="openDetail(${hero.id}, '${type}')">
                                ▶ Play Now
                            </button>
                        </div>
                    </div>
                `;
                document.getElementById('trending-row').innerHTML = generateCards(items.slice(1));

                res = await fetch(`${BASE_URL}/tv/popular?api_key=${API_KEY}`);
                data = await res.json();
                document.getElementById('trending-tv-row').innerHTML = generateCards(data.results.map(i => ({...i, media_type: 'tv'})));

            } catch(e) { console.error(e); }
        }

        async function loadCatalog(type, cat, append = false) {
            if (isFetching) return;
            isFetching = true;
            currentCatalogType = type;

            const grid = document.getElementById('catalog-grid');
            const loader = document.getElementById('catalog-loader');

            if (!append) {
                catalogPage = 1;
                grid.innerHTML = '';
            }

            loader.style.display = 'block';

            try {
                const res = await fetch(`${BASE_URL}/${type}/${cat}?api_key=${API_KEY}&page=${catalogPage}`);
                const data = await res.json();
                totalPages = data.total_pages || 1;
                
                const html = generateCards(data.results.map(i => ({...i, media_type: type})));
                
                if (append) {
                    grid.insertAdjacentHTML('beforeend', html);
                } else {
                    grid.innerHTML = html;
                }
            } catch(e) { 
                console.error(e); 
            } finally {
                isFetching = false;
                loader.style.display = 'none';
            }
        }

        function generateCards(items) {
            return items.map(item => {
                if(!item.poster_path) return '';
                const type = item.media_type || (item.title ? 'movie' : 'tv');
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'NR';
                const tagText = type === 'movie' ? 'Movie' : 'Series';
                const title = item.title || item.name || '';
                return `
                    <div class="media-card" onclick="openDetail(${item.id}, '${type}')">
                        <div class="card-rating"><span>★</span> ${rating}</div>
                        <div class="card-tag">${tagText}</div>
                        <img src="${IMG_500}${item.poster_path}" alt="Poster" loading="lazy">
                        <div class="card-info">
                            <div class="card-title-text">${title}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- SLIDE-UP DETAIL & PLAYER ---
        async function openDetail(id, type) {
            const detailView = document.getElementById('view-detail');
            detailView.classList.add('active');
            detailView.scrollTo(0,0);
            
            document.getElementById('player-container').innerHTML = '';
            document.getElementById('detail-backdrop').style.display = 'block';
            document.getElementById('tv-episodes-section').style.display = 'none';
            document.getElementById('movie-servers-container').style.display = 'none';
            document.getElementById('tv-servers-container').style.display = 'none';
            
            try {
                const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}`);
                const item = await res.json();
                window.currentDetailObject = { ...item, media_type: type };
                
                document.getElementById('detail-backdrop').style.backgroundImage = `url('${IMG_ORIG}${item.backdrop_path || item.poster_path}')`;
                document.getElementById('detail-title').innerText = item.title || item.name;
                
                const year = (item.release_date || item.first_air_date || '').split('-')[0];
                document.getElementById('detail-tags').innerText = `${year} • ★ ${item.vote_average?.toFixed(1) || 'NR'}`;
                document.getElementById('detail-overview').innerText = item.overview;

                const inList = isInWatchlist(item.id);
                let actionHtml = '';

                // If Movie, show Play Button and Server Selectors
                if (type === 'movie') {
                    // Main Play button defaults to Server index 0
                    actionHtml += `<button class="btn-primary" style="flex:2; width:auto; margin:0;" onclick="playMovieServer(0, ${id})">▶ Play</button>`;
                    
                    // Render Server buttons
                    const serversHtml = `
                        <div class="servers-section">
                            <div class="servers-label">Available Servers</div>
                            <div class="server-grid">
                                ${MOVIE_SERVERS.map((srv, index) => `
                                    <button class="server-btn" id="server-btn-${index}" onclick="playMovieServer(${index}, ${id})">
                                        ${srv.name}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    document.getElementById('movie-servers-container').innerHTML = serversHtml;
                    document.getElementById('movie-servers-container').style.display = 'block';
                }
                
                actionHtml += `
                    <button class="btn-secondary" id="mobile-wl-btn" onclick="toggleWatchlist()">
                        ${inList ? '✓ Added' : '➕ List'}
                    </button>
                `;
                document.getElementById('detail-actions').innerHTML = actionHtml;

                // If TV, show episodes logic
                if (type === 'tv' && item.seasons) {
                    activeTvId = id;
                    currentTvServerIndex = 0; // Reset active TV server to the first one
                    currentPlayingEpisode = null; // Clear playing state
                    
                    document.getElementById('tv-episodes-section').style.display = 'block';
                    
                    // Render TV Server buttons
                    const tvServersHtml = `
                        <div class="servers-section" style="margin-bottom: 0;">
                            <div class="servers-label">Available Servers</div>
                            <div class="server-grid">
                                ${TV_SERVERS.map((srv, index) => `
                                    <button class="server-btn ${index === 0 ? 'active-server' : ''}" id="tv-server-btn-${index}" onclick="changeTvServer(${index})">
                                        ${srv.name}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    document.getElementById('tv-servers-container').innerHTML = tvServersHtml;
                    document.getElementById('tv-servers-container').style.display = 'block';

                    const selector = document.getElementById('season-selector');
                    const validSeasons = item.seasons.filter(s => s.season_number > 0);
                    
                    selector.innerHTML = validSeasons.map(s => 
                        `<option value="${s.season_number}">${s.name}</option>`
                    ).join('');
                    
                    if(validSeasons.length > 0) handleSeasonChange(validSeasons[0].season_number);
                }

            } catch (e) { console.error(e); }
        }

        function closeDetail() {
            document.getElementById('view-detail').classList.remove('active');
            document.getElementById('player-container').innerHTML = '';
            currentPlayingEpisode = null;
        }

        // --- SERVER SWITCHING LOGIC ---
        function playMovieServer(serverIndex, id) {
            const server = MOVIE_SERVERS[serverIndex];
            const url = server.url.replace('{id}', id);
            
            document.querySelectorAll('#movie-servers-container .server-btn').forEach(btn => btn.classList.remove('active-server'));
            const activeBtn = document.getElementById(`server-btn-${serverIndex}`);
            if (activeBtn) activeBtn.classList.add('active-server');

            playVideo(url);
        }
        
        function changeTvServer(index) {
            currentTvServerIndex = index;
            
            // Highlight the active TV server button
            document.querySelectorAll('#tv-servers-container .server-btn').forEach(btn => btn.classList.remove('active-server'));
            const activeBtn = document.getElementById(`tv-server-btn-${index}`);
            if (activeBtn) activeBtn.classList.add('active-server');
            
            // Seamlessly swap the iframe source if an episode is currently playing
            if (currentPlayingEpisode) {
                playTvEpisode(currentPlayingEpisode.season, currentPlayingEpisode.episode, currentPlayingEpisode.element);
            }
        }
        
        function playTvEpisode(seasonNum, episodeNum, element) {
            currentPlayingEpisode = { season: seasonNum, episode: episodeNum, element: element };
            const server = TV_SERVERS[currentTvServerIndex];
            const url = server.url.replace('{id}', activeTvId).replace('{season}', seasonNum).replace('{episode}', episodeNum);
            playVideo(url, element);
        }

        function playVideo(url, element = null) {
            document.getElementById('detail-backdrop').style.display = 'none';
            const container = document.getElementById('player-container');
            container.innerHTML = `
                <iframe class="video-player-box" src="${url}" frameborder="0" allowfullscreen></iframe>
            `;
            
            document.getElementById('view-detail').scrollTo({ top: 0, behavior: 'smooth' });

            if (element) {
                document.querySelectorAll('.episode-card').forEach(el => el.classList.remove('active-episode'));
                element.classList.add('active-episode');
            }
        }

        async function handleSeasonChange(seasonNum) {
            if(!activeTvId) return;
            const listEl = document.getElementById('episodes-list');
            listEl.innerHTML = '<div style="padding: 20px; text-align: center;">Loading...</div>';
            
            try {
                const res = await fetch(`${BASE_URL}/tv/${activeTvId}/season/${seasonNum}?api_key=${API_KEY}`);
                const data = await res.json();
                
                listEl.innerHTML = data.episodes.map(ep => {
                    const img = ep.still_path ? IMG_500 + ep.still_path : 'https://via.placeholder.com/300x169?text=No+Image';
                    
                    return `
                        <div class="episode-card" onclick="playTvEpisode(${seasonNum}, ${ep.episode_number}, this)">
                            <img src="${img}" class="episode-thumb">
                            <div class="episode-info">
                                <h4>${ep.episode_number}. ${ep.name}</h4>
                                <p>${ep.overview || 'No description available.'}</p>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch(e) { listEl.innerHTML = 'Error loading episodes.'; }
        }

        // --- SEARCH & WATCHLIST LOGIC ---
        let searchTimeout;
        document.getElementById('search-input').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            const grid = document.getElementById('search-results-grid');
            
            if (!query) { grid.innerHTML = ''; return; }

            searchTimeout = setTimeout(async () => {
                grid.innerHTML = '<div style="width:100%; text-align:center;">Searching...</div>';
                try {
                    const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    const items = data.results.filter(i => i.poster_path && (i.media_type === 'movie' || i.media_type === 'tv'));
                    
                    grid.innerHTML = items.length ? generateCards(items) : '<div style="width:100%; text-align:center;">No results</div>';
                } catch (err) { grid.innerHTML = 'Error.'; }
            }, 500);
        });

        function getWatchlist() { return JSON.parse(localStorage.getItem('mobile_watchlist')) || []; }
        function isInWatchlist(id) { return getWatchlist().some(i => i.id === id); }
        
        function toggleWatchlist() {
            if (!window.currentDetailObject) return;
            let list = getWatchlist();
            const item = window.currentDetailObject;
            const idx = list.findIndex(i => i.id === item.id);
            
            if (idx > -1) list.splice(idx, 1);
            else list.push(item);
            
            localStorage.setItem('mobile_watchlist', JSON.stringify(list));
            document.getElementById('mobile-wl-btn').innerText = isInWatchlist(item.id) ? '✓ Added' : '➕ List';
        }

        function loadWatchlist() {
            const list = getWatchlist();
            const grid = document.getElementById('catalog-grid');
            document.getElementById('catalog-loader').style.display = 'none';
            grid.innerHTML = list.length ? generateCards(list) : '<div style="padding:20px; width:100%; text-align:center;">List is empty</div>';
        }
    </script>
</body>
</html>
